<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry &amp; Winnie · 森林動物大賽跑 12/12 婚禮大螢幕實況轉播</title>

  <!-- Google Fonts 典雅字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Firebase 9.23.0 SDK (即時連線全場手機步數與戰況) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d1710;
      position: relative;
      user-select: none;
      font-family: 'Montserrat', 'Noto Serif TC', -apple-system, sans-serif;
      color: #fff;
    }

    /* =========================================================
       1. 16:9 全景沉浸式晨曦森林動態背景
       ========================================================= */
    .screen-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .forest-bg {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      background-image: url("assets/master_forest.jpg"), url("assets/fairytale_forest_trail.jpg"), url("https://bringbowl.github.io/wedding-engagement/assets/master_forest.jpg");
      background-size: cover;
      background-position: center 36%;
      animation: kenBurns 45s ease-in-out infinite alternate;
      filter: brightness(0.82) contrast(1.12) saturate(1.15);
    }

    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.04) translate(-0.8%, -0.4%); }
      100% { transform: scale(1.02) translate(0.8%, 0.4%); }
    }

    .sunbeams-breathing {
      position: absolute;
      inset: -10%;
      background: radial-gradient(ellipse at 46% 30%, rgba(255, 230, 150, 0.22) 0%, rgba(240, 195, 100, 0.08) 45%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: godRaysDrift 14s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes godRaysDrift {
      0% { opacity: 0.55; transform: rotate(-1.5deg) scale(0.98); }
      50% { opacity: 0.95; transform: rotate(1deg) scale(1.04); }
      100% { opacity: 0.65; transform: rotate(0deg) scale(1.01); }
    }

    .light-mist-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 36%, rgba(240, 195, 110, 0.1) 0%, rgba(22, 38, 24, 0.35) 55%, rgba(8, 16, 10, 0.75) 100%);
      pointer-events: none;
      z-index: 3;
    }

    #particlesCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    /* 迷霧森林大螢幕全景飄移晨霧層 (Mist Forest Overlay) */
    .screen-mist-frenzy-overlay {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      z-index: 6;
      display: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 248, 220, 0.35) 0%, rgba(200, 225, 245, 0.28) 45%, rgba(18, 32, 22, 0.5) 85%);
      filter: blur(28px);
      mix-blend-mode: screen;
      animation: mistRoll 16s ease-in-out infinite alternate;
    }

    .screen-mist-frenzy-overlay.active {
      display: block;
      opacity: 1;
    }

    @keyframes mistRoll {
      0% { transform: translate(-3%, -2%) scale(1); }
      50% { transform: translate(4%, 3%) scale(1.08); }
      100% { transform: translate(-2%, 4%) scale(1.03); }
    }

    /* =========================================================
       2. 廣播級頂部戰況導覽條 (Broadcast Top Bar)
       ========================================================= */
    .broadcast-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: linear-gradient(180deg, rgba(8, 16, 10, 0.95) 0%, rgba(14, 26, 18, 0.85) 65%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      z-index: 50;
      border-bottom: 1px solid rgba(197, 155, 76, 0.3);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-wedding-emblem {
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 8px rgba(234, 179, 8, 0.6));
      animation: emblemFloat 3s ease-in-out infinite alternate;
    }

    @keyframes emblemFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }

    .top-title-group {
      display: flex;
      flex-direction: column;
    }

    .top-main-title {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: #f7e7ce;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-sub-tag {
      font-size: 0.78rem;
      color: #d1b187;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .top-bar-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: 30px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: #86efac;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: livePulse 1.2s infinite;
    }

    @keyframes livePulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-badge-label {
      font-size: 0.65rem;
      color: #a8947d;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-badge-value {
      font-family: 'Cinzel', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fef08a;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }

    /* =========================================================
       3. 16:9 主戰況舞台分割版面 (Leaderboard + Sprint Arena)
       ========================================================= */
    .broadcast-main-stage {
      position: absolute;
      top: 80px;
      bottom: 60px;
      left: 36px;
      right: 36px;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 28px;
      z-index: 20;
    }

    /* 左側：大螢幕即時榜單 (Live Leaderboard Column) */
    .leaderboard-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(10, 20, 14, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(197, 155, 76, 0.4);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(197, 155, 76, 0.25);
    }

    .column-title {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .column-subtitle {
      font-size: 0.72rem;
      color: #c5a059;
      font-weight: 600;
    }

    .rank-cards-list {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .screen-rank-card {
      position: absolute;
      left: 0;
      right: 0;
      height: 116px;
      background: rgba(22, 38, 26, 0.86);
      border: 1.5px solid rgba(197, 155, 76, 0.3);
      border-radius: 18px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: top 0.75s cubic-bezier(0.25, 1.25, 0.5, 1), transform 0.4s ease, border-color 0.4s ease, background 0.4s ease, opacity 0.5s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .screen-rank-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      bottom: 0;
      background: #c59b4c;
    }

    .screen-rank-card.rank-1 {
      background: linear-gradient(135deg, rgba(65, 48, 16, 0.92) 0%, rgba(35, 25, 10, 0.92) 100%);
      border: 2px solid #eab308;
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.28);
      position: relative;
    }
    .screen-rank-card.rank-1::after {
      content: '👑';
      position: absolute;
      top: -12px;
      left: 12px;
      font-size: 1.1rem;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      animation: crownBobScreen 2.5s ease-in-out infinite;
      z-index: 5;
    }
    @keyframes crownBobScreen {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-3px) rotate(6deg); }
    }
    .screen-rank-card.rank-1::before { background: #facc15; }

    .screen-rank-card.rank-2 {
      background: linear-gradient(135deg, rgba(40, 50, 58, 0.9) 0%, rgba(20, 26, 32, 0.9) 100%);
      border: 1.5px solid #cbd5e1;
    }
    .screen-rank-card.rank-2::before { background: #94a3b8; }

    .screen-rank-card.rank-3 {
      background: linear-gradient(135deg, rgba(58, 38, 25, 0.9) 0%, rgba(30, 18, 12, 0.9) 100%);
      border: 1.5px solid #d97706;
    }
    .screen-rank-card.rank-3::before { background: #b45309; }

    .card-medal-badge {
      font-size: 1.4rem;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-animal-emoji {
      font-size: 2rem;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-info-group {
      flex: 1;
      min-width: 0;
    }

    .card-team-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-members-text {
      font-size: 0.72rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .card-meter-box {
      text-align: right;
      flex-shrink: 0;
    }

    .card-meter-number {
      font-family: 'Cinzel', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fef08a;
      letter-spacing: 0.5px;
    }

    .card-meter-unit {
      font-size: 0.7rem;
      color: #d1b187;
      font-weight: 600;
    }

    /* 右側：多跑道賽道奔馳即時實況 (Live Sprint Arena Column) */
    .arena-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10, 20, 14, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(197, 155, 76, 0.4);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
    }

    .arena-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(197, 155, 76, 0.25);
    }

    .arena-title {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .finish-line-goal {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #f7e7ce;
      background: rgba(234, 179, 8, 0.16);
      border: 1px solid rgba(234, 179, 8, 0.4);
      border-radius: 20px;
      padding: 4px 12px;
      font-weight: 700;
    }

    .lanes-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: visible;
    }

    /* 師承喜帖祝福能量條 · 奢華婚禮大螢幕競速跑道卡 */
    .sprint-lane {
      position: absolute;
      left: 0;
      right: 0;
      height: 116px;
      background: linear-gradient(135deg, rgba(16, 28, 20, 0.94) 0%, rgba(22, 36, 26, 0.9) 100%);
      border: 1.5px solid rgba(197, 155, 76, 0.4);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 20px 10px 20px;
      gap: 8px;
      transition: top 0.75s cubic-bezier(0.25, 1.25, 0.5, 1), transform 0.4s ease, border-color 0.4s ease, opacity 0.5s ease;
      overflow: visible;
    }

    .sprint-lane.is-leader-lane {
      background: linear-gradient(135deg, rgba(34, 28, 12, 0.96) 0%, rgba(22, 36, 26, 0.92) 100%);
      border: 2px solid #eab308;
      box-shadow: 0 0 28px rgba(234, 179, 8, 0.35), 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.15);
    }

    /* 上排：隊伍資訊、成員數與即時里程戰況 */
    .lane-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 4px;
    }

    .lane-team-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lane-rank-badge {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 3px 9px;
      border-radius: 8px;
      font-family: 'Cinzel', monospace;
      font-size: 0.88rem;
      font-weight: 800;
      color: #cbd5e1;
      transition: transform 0.3s;
      flex-shrink: 0;
    }

    .lane-rank-badge.champ-badge {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border: 1.5px solid #fde047;
      color: #fffbeb;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.7);
    }

    .lane-rank-badge.rank-popped {
      transform: scale(1.35);
    }

    .lane-team-title {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lane-members-pill {
      font-size: 0.78rem;
      color: #d1b187;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(197, 155, 76, 0.3);
      border-radius: 20px;
      padding: 2px 10px;
    }

    .lane-meter-info {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .lane-status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      background: rgba(234, 179, 8, 0.16);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: #fef08a;
    }

    .lane-status-badge.alert-chase {
      background: rgba(239, 68, 68, 0.22);
      border: 1px solid rgba(239, 68, 68, 0.65);
      color: #fca5a5;
      animation: alertPulse 1s infinite alternate;
    }

    @keyframes alertPulse {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.03); }
    }

    .lane-meters-num {
      font-family: 'Cinzel', monospace;
      font-size: 1.4rem;
      font-weight: 900;
      color: #fef08a;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }

    .lane-meters-unit {
      font-family: 'Cinzel', monospace;
      font-size: 0.82rem;
      color: #d1b187;
      font-weight: 700;
    }

    /* 下排：優雅膠囊進度條賽道 (Sleek Pill Track) 與金邊珍珠選手勳章 */
    .lane-track-pill-container {
      position: relative;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .lane-track-pill {
      position: relative;
      flex: 1;
      height: 20px;
      background: rgba(8, 16, 12, 0.78);
      border: 1.5px solid rgba(197, 155, 76, 0.4);
      border-radius: 999px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.3);
      overflow: visible;
    }

    /* 賽道無盡流動背景刻度線 */
    .lane-ticks {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent, transparent 36px, rgba(255, 255, 255, 0.08) 36px, rgba(255, 255, 255, 0.08) 38px);
      animation: trackStream 1s linear infinite;
      z-index: 1;
      pointer-events: none;
      border-radius: 999px;
    }

    @keyframes trackStream {
      0% { background-position-x: 0px; }
      100% { background-position-x: -38px; }
    }

    /* 專屬多層次植物與大地奢華婚禮色彩條 (100% 飽和滿色) */
    .lane-progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.12, 0.8, 0.32, 1);
      z-index: 2;
      overflow: hidden;
      opacity: 1;
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      border-bottom: 1.5px solid rgba(0, 0, 0, 0.4);
    }

    .lane-progress-beam {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
      animation: beamSweep 1.6s infinite linear;
    }

    @keyframes beamSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .lane-progress-head {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: #ffffff;
      border-radius: 999px;
    }

    .lane-goal-trophy {
      font-size: 1.6rem;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 8px rgba(250, 204, 21, 0.6));
      animation: trophyShine 2.5s infinite ease-in-out;
      user-select: none;
    }

    @keyframes trophyShine {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(6deg); }
    }

    /* 馳騁賽道的金邊珍珠動物選手勳章 (大幅超越 20px 跑道高度，破框顯眼震撼) */
    .running-avatar-wrapper {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: left 0.45s cubic-bezier(0.12, 0.8, 0.32, 1);
      z-index: 25;
      pointer-events: none;
    }

    .avatar-medallion-box {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #faf5ed 65%, #ebdcc3 100%);
      border: 2.5px solid #c59b4c;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: runnerBob 0.35s infinite alternate ease-in-out;
    }

    .is-leader-lane .avatar-medallion-box {
      border: 2.5px solid #facc15;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.7), 0 4px 14px rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.95);
    }

    @keyframes runnerBob {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }

    .avatar-emoji {
      font-size: 2.25rem;
      line-height: 1;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .avatar-speedlines {

    const ANIMAL_PALETTES = [
      { gradient: 'linear-gradient(90deg, #5b8764 0%, #8ea772 25%, #dfa84f 60%, #fef08a 100%)', glow: 'rgba(250, 204, 21, 0.75)' }, // 0: 暖金極光 (自然森林與香檳金)
      { gradient: 'linear-gradient(90deg, #064e3b 0%, #059669 30%, #10b981 65%, #6ee7b7 100%)', glow: 'rgba(16, 185, 129, 0.75)' }, // 1: 翡翠晨露 (尤加利綠與薄荷)
      { gradient: 'linear-gradient(90deg, #164e63 0%, #0891b2 30%, #06b6d4 65%, #67e8f9 100%)', glow: 'rgba(6, 182, 212, 0.75)' },   // 2: 冰川晨光 (青藍極光)
      { gradient: 'linear-gradient(90deg, #4c1d95 0%, #7e22ce 30%, #a855f7 65%, #e9d5ff 100%)', glow: 'rgba(168, 85, 247, 0.75)' }, // 3: 幻紫薰衣草 (乾燥薰衣草紫)
      { gradient: 'linear-gradient(90deg, #881337 0%, #be123c 30%, #f43f5e 65%, #fecdd3 100%)', glow: 'rgba(244, 63, 94, 0.75)' },   // 4: 玫瑰花瓣 (粉紅花瓣)
      { gradient: 'linear-gradient(90deg, #1e3a8a 0%, #1d4ed8 30%, #3b82f6 65%, #93c5fd 100%)', glow: 'rgba(59, 130, 246, 0.75)' },  // 5: 蔚藍星海 (星夜藍)
      { gradient: 'linear-gradient(90deg, #7c2d12 0%, #c2410c 30%, #f97316 65%, #fed7aa 100%)', glow: 'rgba(249, 115, 22, 0.75)' }, // 6: 暖陽蜜桃 (蜜桃金橘)
      { gradient: 'linear-gradient(90deg, #365314 0%, #4d7c0f 30%, #84cc16 65%, #bef264 100%)', glow: 'rgba(132, 204, 22, 0.75)' }, // 7: 嫩綠初芽 (春意嫩綠)
      { gradient: 'linear-gradient(90deg, #701a75 0%, #9d174d 30%, #ec4899 65%, #fbcfe8 100%)', glow: 'rgba(236, 72, 153, 0.75)' }, // 8: 醉人牡丹 (牡丹嫣紅)
      { gradient: 'linear-gradient(90deg, #134e4a 0%, #0f766e 30%, #14b8a6 65%, #99f6e4 100%)', glow: 'rgba(20, 184, 166, 0.75)' }   // 9: 碧海極光 (海玻璃綠)
    ];

    function getAnimalTheme(animalId) {
      let hash = 0;
      for (let i = 0; i < animalId.length; i++) {
        hash = (hash << 5) - hash + animalId.charCodeAt(i);
        hash |= 0;
      }
      const paletteIdx = Math.abs(hash) % ANIMAL_PALETTES.length;
      return ANIMAL_PALETTES[paletteIdx];
    }

    const activeRankCardsMap = new Map();
    const activeLanesMap = new Map();

    function renderBroadcastScreen() {
      const sorted = getSortedTeams();
      const top5 = sorted.slice(0, 5);

      // 全場總累積里程
      const totalMeters = sorted.reduce((sum, t) => sum + (t.meters || 0), 0);
      const totalElem = document.getElementById('globalTotalMeters');
      if (totalElem) totalElem.textContent = totalMeters.toLocaleString() + ' m';

      // 1. 左側風雲榜渲染 (名次變更時上下流暢滑動)
      const listContainer = document.getElementById('screenRankList');
      if (listContainer) {
        const currentTopIds = new Set(top5.map(t => t.id));

        // 移除跌出前 5 名的舊卡片 (平滑淡出)
        for (const [id, el] of activeRankCardsMap.entries()) {
          if (!currentTopIds.has(id)) {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px) scale(0.92)';
            setTimeout(() => {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 600);
            activeRankCardsMap.delete(id);
          }
        }

        const rankClasses = ['rank-1', 'rank-2', 'rank-3', '', ''];
        const medals = ['🥇', '🥈', '🥉', '4', '5'];

        top5.forEach((team, idx) => {
          let card = activeRankCardsMap.get(team.id);
          const topPosition = `calc(${idx} * ((100% - 116px) / 4))`;

          let statusText = '🏃 尚無跑者加入 · 等待開跑';
          if (team.membersCount >= 5) {
            statusText = '🔥 陣營已滿員 (5/5人) · 全力衝刺中';
          } else if (team.membersCount > 0) {
            statusText = `🏃 ${team.membersCount} 位森林跑者齊心狂飆中`;
          }

          if (!card) {
            card = document.createElement('div');
            card.className = `screen-rank-card ${rankClasses[idx] || ''}`;
            card.dataset.teamId = team.id;
            card.style.top = topPosition;
            card.style.opacity = '0';
            card.style.transform = 'scale(0.92)';

            card.innerHTML = `
              <div class="card-medal-badge">${medals[idx]}</div>
              <div class="card-animal-emoji">${team.emoji}</div>
              <div class="card-info-group">
                <div class="card-team-title">
                  <span>${team.name}</span>
                  <span class="card-members-badge" style="font-size:0.7rem; color:#d1b187; font-weight:600;">(${team.membersCount}/5人)</span>
                </div>
                <div class="card-members-text">${statusText}</div>
              </div>
              <div class="card-meter-box">
                <div class="card-meter-number">${(team.meters || 0).toLocaleString()}</div>
                <div class="card-meter-unit">METERS</div>
              </div>
            `;
            listContainer.appendChild(card);
            activeRankCardsMap.set(team.id, card);

            requestAnimationFrame(() => {
              card.style.opacity = '1';
              card.style.transform = 'scale(1)';
            });
          } else {
            // 平滑滑動至新名次高度！
            card.style.top = topPosition;
            card.className = `screen-rank-card ${rankClasses[idx] || ''}`;

            const medalEl = card.querySelector('.card-medal-badge');
            if (medalEl && medalEl.textContent !== medals[idx]) medalEl.textContent = medals[idx];

            const membersBadge = card.querySelector('.card-members-badge');
            if (membersBadge) membersBadge.textContent = `(${team.membersCount}/5人)`;

            const membersText = card.querySelector('.card-members-text');
            if (membersText && membersText.textContent !== statusText) membersText.textContent = statusText;

            const meterNum = card.querySelector('.card-meter-number');
            if (meterNum) meterNum.textContent = (team.meters || 0).toLocaleString();
          }
        });
      }

      // 2. 右側多跑道動態奔馳實況渲染 (師承喜帖祝福能量條 · 膠囊細跑道 + 金邊珍珠勳章 + 無極限狂衝)
      const lanesContainer = document.getElementById('screenLanesContainer');
      if (lanesContainer) {
        const currentTopIds = new Set(top5.map(t => t.id));

        // 移除跌出前 5 名的舊跑道
        for (const [id, el] of activeLanesMap.entries()) {
          if (!currentTopIds.has(id)) {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px) scale(0.92)';
            setTimeout(() => {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 600);
            activeLanesMap.delete(id);
          }
        }

        // 動態無極限刻度 (動態保留 25% 跑道緩衝，跑越多畫面延伸越遠，永無盡頭)
        const leaderMeters = top5[0]?.meters || 0;
        const dynamicMax = Math.max(100, Math.ceil(leaderMeters * 1.25 / 50) * 50);

        top5.forEach((team, idx) => {
          let lane = activeLanesMap.get(team.id);
          const topPosition = `calc(${idx} * ((100% - 116px) / 4))`;
          const theme = getAnimalTheme(team.id);
          const isLeader = (idx === 0);

          // 隊伍動態戰況描述 (師承喜帖祝福能量條 status 文字)
          let statusSummary = '等待加入';
          if (team.membersCount >= 5) {
            statusSummary = '滿員衝刺中';
          } else if (team.membersCount > 0) {
            statusSummary = `${team.membersCount}人狂飆`;
          }

          let leadStatusText = '起跑蓄能 🌿';
          let statusClass = '';
          if (isLeader) {
            const runnerUpMeters = top5[1]?.meters || 0;
            const gap = (team.meters || 0) - runnerUpMeters;
            if (runnerUpMeters > 0 && gap <= 50) {
              leadStatusText = '快被超車 ⚡';
              statusClass = 'alert-chase';
            } else if ((team.meters || 0) > 0) {
              leadStatusText = '遙遙領先 🚀';
            }
          } else {
            if ((team.meters || 0) > 0) {
              const leaderMeters = top5[0]?.meters || 0;
              const gap = leaderMeters - (team.meters || 0);
              if (gap <= 50) {
                leadStatusText = '急速追趕 🔥';
                statusClass = 'alert-chase';
              } else {
                leadStatusText = '澎湃狂奔 🌊';
              }
            }
          }

          // 計算膠囊跑道進度 (0m 起跑線 0% ~ 96% 終點獎盃區)
          const isZero = ((team.meters || 0) <= 0);
          const pct = isZero
            ? 0
            : Math.min(96, Math.max(8, Math.floor(((team.meters || 0) / dynamicMax) * 94)));
          const speedlineText = isZero ? '' : (isLeader ? '⚡💨' : '💨');
          
          // 52px 珍珠金牌勳章在 20px 膠囊跑道上的滑動精準約束
          const avatarLeft = isZero ? '26px' : `calc(26px + (100% - 52px) * ${pct / 100})`;
          const barWidth = isZero ? '0%' : `calc(26px + (100% - 52px) * ${pct / 100})`;

          if (!lane) {
            lane = document.createElement('div');
            lane.className = `sprint-lane ${isLeader ? 'is-leader-lane' : ''}`;
            lane.dataset.teamId = team.id;
            lane.style.top = topPosition;
            lane.style.opacity = '0';
            lane.style.transform = 'scale(0.95)';

            lane.innerHTML = `
              <div class="lane-header-row">
                <div class="lane-team-info">
                  <span class="lane-rank-badge ${isLeader ? 'champ-badge' : ''}">#${idx + 1}</span>
                  <span class="lane-team-title">${team.emoji} ${team.name}</span>
                  <span class="lane-members-pill">(${team.membersCount}/5人 · ${statusSummary})</span>
                </div>
                <div class="lane-meter-info">
                  <span class="lane-status-badge ${statusClass}">${leadStatusText}</span>
                  <span class="lane-meters-num">${(team.meters || 0).toLocaleString()}</span>
                  <span class="lane-meters-unit">m</span>
                </div>
              </div>

              <div class="lane-track-pill-container">
                <div class="lane-track-pill">
                  <div class="lane-ticks"></div>
                  
                  <div class="lane-progress-bar" style="width: ${barWidth}; opacity: ${isZero ? '0' : '1'}; background: ${theme.gradient}; box-shadow: 0 0 20px ${theme.glow};">
                    <div class="lane-progress-beam"></div>
                    <div class="lane-progress-head" style="box-shadow: 0 0 10px #ffffff, 0 0 20px ${theme.glow};"></div>
                  </div>

                  <div class="running-avatar-wrapper" style="left: ${avatarLeft};">
                    <div class="avatar-speedlines">${speedlineText}</div>
                    <div class="avatar-medallion-box">
                      <span class="avatar-emoji">${team.emoji}</span>
                    </div>
                  </div>
                </div>
                <div class="lane-goal-trophy" title="12/12 婚禮幸福終點">🏆</div>
              </div>
            `;
            lanesContainer.appendChild(lane);
            activeLanesMap.set(team.id, lane);

            requestAnimationFrame(() => {
              lane.style.opacity = '1';
              lane.style.transform = 'scale(1)';
            });
          } else {
            // 平滑滑動至新名次高度 (FLIP 上下滑動效果關鍵！)
            lane.style.top = topPosition;
            if (isLeader) {
              lane.classList.add('is-leader-lane');
            } else {
              lane.classList.remove('is-leader-lane');
            }

            // 更新上排標頭
            const rankBadge = lane.querySelector('.lane-rank-badge');
            if (rankBadge) {
              if (rankBadge.textContent !== `#${idx + 1}`) {
                rankBadge.textContent = `#${idx + 1}`;
                rankBadge.classList.add('rank-popped');
                setTimeout(() => rankBadge.classList.remove('rank-popped'), 400);
              }
              if (isLeader) rankBadge.classList.add('champ-badge');
              else rankBadge.classList.remove('champ-badge');
            }

            const teamTitle = lane.querySelector('.lane-team-title');
            if (teamTitle) teamTitle.innerHTML = `${team.emoji} ${team.name}`;

            const membersPill = lane.querySelector('.lane-members-pill');
            if (membersPill) membersPill.textContent = `(${team.membersCount}/5人 · ${statusSummary})`;

            const statusBadge = lane.querySelector('.lane-status-badge');
            if (statusBadge) {
              statusBadge.textContent = leadStatusText;
              statusBadge.className = `lane-status-badge ${statusClass}`;
            }

            const meterNum = lane.querySelector('.lane-meters-num');
            if (meterNum) meterNum.textContent = (team.meters || 0).toLocaleString();

            // 更新膠囊賽道進度條 (師承喜帖祝福能量條 100% 滿色飽和流光)
            const progressBar = lane.querySelector('.lane-progress-bar');
            if (progressBar) {
              progressBar.style.width = barWidth;
              progressBar.style.opacity = isZero ? '0' : '1';
              progressBar.style.background = theme.gradient;
              progressBar.style.boxShadow = `0 0 20px ${theme.glow}`;
              const head = progressBar.querySelector('.lane-progress-head');
              if (head) head.style.boxShadow = `0 0 10px #ffffff, 0 0 20px ${theme.glow}`;
            }

            // 更新金邊珍珠動物勳章狂衝位置 (破框馳騁)
            const avatarWrapper = lane.querySelector('.running-avatar-wrapper');
            if (avatarWrapper) {
              avatarWrapper.style.left = avatarLeft;
            }

            const speedlines = lane.querySelector('.avatar-speedlines');
            if (speedlines) {
              speedlines.textContent = speedlineText;
            }

            const emojiSpan = lane.querySelector('.avatar-emoji');
            if (emojiSpan && emojiSpan.textContent !== team.emoji) {
              emojiSpan.textContent = team.emoji;
            }
          }
        });
      }
    }

    // =========================================================
    // 4. 迷霧森林最後衝刺與頒獎結算狀態處理
    function toggleMistCountdown() {
      if (rtdb) {
        if (!isMistSprintActive) {
          const now = Date.now();
          rtdb.ref('gameState').set({
            mode: 'mist',
            mistStartedAt: now,
            mistDuration: 30,
            mistEndsAt: now + 30000
          }).catch(e => console.warn(e));
        } else {
          rtdb.ref('gameState').set({ mode: 'normal' }).catch(e => console.warn(e));
        }
      } else {
        handleGameState({
          mode: isMistSprintActive ? 'normal' : 'mist',
          mistEndsAt: Date.now() + 30000
        });
      }
    }

    function handleGameState(state) {
      const mistOverlay = document.getElementById('screenMistOverlay');
      const mistBanner = document.getElementById('screenMistBanner');
      const mistTimer = document.getElementById('screenMistTimer');
      const toggleText = document.getElementById('mistToggleText');

      if (state.mode === 'mist') {
        const endsAt = state.mistEndsAt || (Date.now() + 30000);
        const remSec = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));

        if (remSec > 0) {
          isMistSprintActive = true;
          isRaceFinished = false;
          if (mistOverlay) mistOverlay.classList.add('active');
          if (mistBanner) mistBanner.classList.add('active');
          if (mistTimer) mistTimer.textContent = `${remSec}s`;
          if (toggleText) toggleText.textContent = '🛑 結束倒數回一般模式';

          if (mistCountdownTimer) clearInterval(mistCountdownTimer);
          mistCountdownTimer = setInterval(() => {
            const cur = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
            if (mistTimer) mistTimer.textContent = `${cur}s`;
            if (cur <= 0) {
              clearInterval(mistCountdownTimer);
              mistCountdownTimer = null;
              showGrandPodium();
            }
          }, 1000);
          return;
        }
      }

      if (mistCountdownTimer) {
        clearInterval(mistCountdownTimer);
        mistCountdownTimer = null;
      }
      isMistSprintActive = false;
      if (mistOverlay) mistOverlay.classList.remove('active');
      if (mistBanner) mistBanner.classList.remove('active');
      if (toggleText) toggleText.textContent = '🌫️ 啟動 30 秒倒數衝刺';

      if (state.mode === 'finished') {
        isRaceFinished = true;
        showGrandPodium();
      } else {
        isRaceFinished = false;
        closeGrandPodium();
      }
    }

    // 盛大三階奧運頒獎台
    function showGrandPodium() {
      const overlay = document.getElementById('screenPodiumOverlay');
      const row = document.getElementById('podiumStagesRow');
      if (!overlay || !row) return;

      const sorted = getSortedTeams();

        { cls: 'pillar-runner-up', medal: '🥈 亞軍隊伍', rankNum: 2 },
        { cls: 'pillar-third', medal: '🥉 季軍隊伍', rankNum: 3 }
      ];

      // 順序排列：亞軍 (左)、冠軍 (中)、季軍 (右)
      const podiumOrder = [1, 0, 2];

      podiumOrder.forEach(idx => {

    function togglePodiumView() {
      const overlay = document.getElementById('screenPodiumOverlay');
      if (overlay && overlay.classList.contains('active')) {
        closeGrandPodium();
      } else {
        showGrandPodium();
      }

    // =========================================================
    // 5. 飄浮金色螢火蟲與光斑粒子 Canvas
    // =========================================================
    const canvas = document.getElementById("particlesCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2.2 + 0.8;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.3 - 0.1;
        this.fadeSpeed = Math.random() * 0.008 + 0.004;
        this.fadingOut = Math.random() > 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.fadingOut) {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0.08) this.fadingOut = false;
        } else {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= 0.85) this.fadingOut = true;
        }
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        ctx.shadowColor = "rgba(255, 210, 90, 0.9)";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 48; i++) {
      particles.push(new Firefly());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // =========================================================
    // 6. 頒獎典禮盛大煙火彩砲 Canvas (Grand Fireworks)
    // =========================================================
    const fwCanvas = document.getElementById("fireworksCanvas");
    const fwCtx = fwCanvas.getContext("2d");
    let fireworks = [];
    let fwTimer = null;

    function resizeFwCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeFwCanvas);
    resizeFwCanvas();

    class ConfettiPiece {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 3;
        this.gravity = 0.18;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 12;
        const colors = ['#facc15', '#fef08a', '#fb7185', '#38bdf8', '#34d399', '#ffffff'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
      }
      draw() {
        fwCtx.save();
        fwCtx.translate(this.x, this.y);
        fwCtx.rotate((this.rotation * Math.PI) / 180);
        fwCtx.fillStyle = this.color;
        fwCtx.globalAlpha = Math.max(0, this.alpha);
        fwCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        fwCtx.restore();
      }
    }

    function spawnFireworksCluster() {
      const x = Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1;
      const y = Math.random() * fwCanvas.height * 0.5 + fwCanvas.height * 0.15;
      for (let i = 0; i < 60; i++) {
        fireworks.push(new ConfettiPiece(x, y));
      }
    }

    function animateFireworks() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const p = fireworks[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) fireworks.splice(i, 1);
      }
      if (fireworks.length > 0) {
        requestAnimationFrame(animateFireworks);
      }
    }

    function startFireworks() {
      if (fwTimer) clearInterval(fwTimer);
      spawnFireworksCluster();
      spawnFireworksCluster();
      animateFireworks();
      fwTimer = setInterval(() => {
        spawnFireworksCluster();
        animateFireworks();
      }, 900);
    }

    function stopFireworks() {
      if (fwTimer) clearInterval(fwTimer);
      fwTimer = null;
      fireworks = [];
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    }

    // =========================================================
    // 7. 工具列功能 (全螢幕 + 大自然木吉他合成器)
    // =========================================================
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen request failed", err);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    let audioCtx = null;
    let isPlaying = false;
    let chimeTimer = null;

    function toggleAudio() {
      if (!isPlaying) {
        startAudio();
        document.getElementById("audioText").innerText = "暫停氛圍音效";
        document.getElementById("audioBtn").style.background = "rgba(77, 102, 80, 0.95)";
        isPlaying = true;
      } else {
        stopAudio();
        document.getElementById("audioText").innerText = "播放大自然與氛圍音";
        document.getElementById("audioBtn").style.background = "rgba(20, 32, 22, 0.85)";
        isPlaying = false;
      }
    }

    function startAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      function playChime() {
        if (!isPlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        const freq = scale[Math.floor(Math.random() * scale.length)];
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 2.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 3.0);

        chimeTimer = setTimeout(playChime, 2500 + Math.random() * 3000);
      }
      playChime();
    }

    function stopAudio() {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (chimeTimer) clearTimeout(chimeTimer);
    }

    // 啟動入口
    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
      renderBroadcastScreen();
    });
  </script>
</body>
