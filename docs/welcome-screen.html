<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry &amp; Winnie · 阿沐大螢幕 100% 純淨森林迎賓實景窗 ＋ Veo 3.1 高畫質野生動物動態彩蛋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #141f16;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 16:9 全景森林大螢幕舞台 */
    .screen-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d160f;
    }

    /* 底層：Veo 1080p 純淨呼吸微動森林背景影片 (Loop 0) */
    .forest-video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* 會場愛迪生暖金穹頂色溫調校：增強對比與深翠綠意，壓抑過曝刺眼感 */
      filter: brightness(0.88) contrast(1.10) saturate(1.15);
      z-index: 1;
    }

    /* 上層：Veo 1080p 動物動態彩蛋影片圖層 (平滑無縫交疊) */
    .cameo-video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.88) contrast(1.10) saturate(1.15);
      z-index: 2;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .cameo-video-layer.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 晨曦暖金與深翠漸層暗角（與阿沐 2700K 吊燈完美融合） */
    .light-mist-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 34%, rgba(240, 195, 110, 0.10) 0%, rgba(22, 38, 24, 0.28) 58%, rgba(8, 16, 10, 0.65) 100%);
      pointer-events: none;
      z-index: 3;
    }

    .canopy-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(10, 20, 12, 0.40) 0%, transparent 20%, transparent 80%, rgba(6, 14, 8, 0.55) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* 動態晨曦丁達爾光柱微動呼吸 */
    .sunbeams-breathing {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 70%;
      height: 120%;
      background: radial-gradient(ellipse at 46% 32%, rgba(255, 230, 150, 0.16) 0%, rgba(240, 195, 100, 0.06) 45%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: godRaysDrift 14s ease-in-out infinite alternate;
      z-index: 4;
    }

    @keyframes godRaysDrift {
      0% { opacity: 0.50; transform: scale(0.98) translateY(0); }
      50% { opacity: 0.90; transform: scale(1.03) translateY(-1%); }
      100% { opacity: 0.60; transform: scale(1.01) translateY(0.5%); }
    }

    /* 飄浮金色螢火蟲與光斑粒子 Canvas */
    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* 柔和微光彩蛋提示 Toast（幽雅低調，4秒後自動隱退） */
    .cameo-toast {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(16, 26, 18, 0.86);
      border: 1px solid rgba(230, 205, 140, 0.5);
      color: #f7eedc;
      padding: 10px 26px;
      border-radius: 30px;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
      transition: opacity 0.5s ease, transform 0.5s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cameo-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .cameo-toast .toast-icon {
      font-size: 1.25rem;
    }

    /* 底部操作控制列 (Hover 顯現，大螢幕播放時隱形低調) */
    .screen-toolbar {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 100;
      display: flex;
      gap: 10px;
      opacity: 0.25;
      transition: opacity 0.3s ease;
    }

    .screen-toolbar:hover {
      opacity: 1;
    }

    .tool-btn {
      background: rgba(18, 30, 20, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(72, 98, 75, 0.95);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* 召喚選單下拉容器 */
    .cameo-dropdown {
      position: relative;
      display: inline-block;
    }

    .cameo-menu {
      display: none;
      position: absolute;
      bottom: 46px;
      right: 0;
      background: rgba(16, 28, 18, 0.96);
      border: 1px solid rgba(220, 195, 130, 0.45);
      border-radius: 14px;
      padding: 8px 0;
      min-width: 240px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
    }

    .cameo-dropdown:hover .cameo-menu {
      display: block;
    }

    .cameo-opt {
      padding: 10px 18px;
      font-size: 0.82rem;
      color: #e6eee7;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .cameo-opt:hover {
      background: rgba(85, 118, 88, 0.65);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="screen-stage" id="screenStage">
    <!-- 底層：1080p 呼吸感微動晨曦森林空景 (Loop 0 無縫循環) -->
    <video class="forest-video-layer" id="bgVideo" src="assets/videos/loop0_forest_empty.mp4" playsinline loop muted autoplay></video>

    <!-- 上層：1080p 野生動物彩蛋影片 (每隔45秒柔和疊化登場) -->
    <video class="cameo-video-layer" id="cameoVideo" playsinline muted></video>

    <!-- 晨曦暖金與暗角光影 -->
    <div class="light-mist-overlay"></div>
    <div class="canopy-vignette"></div>
    <div class="sunbeams-breathing"></div>
    <canvas id="particlesCanvas"></canvas>
  </div>

  <!-- 彩蛋提示 Toast -->
  <div class="cameo-toast" id="cameoToast">
    <span class="toast-icon">🦌</span>
    <span id="toastText">森林彩蛋：成對梅花鹿悠閒漫步中...</span>
  </div>

  <!-- 浮動控制工具列 -->
  <div class="screen-toolbar">
    <!-- 召喚動物路過選單 -->
    <div class="cameo-dropdown">
      <button class="tool-btn">
        <span>🐾</span> <span>播放動物彩蛋 ▼</span>
      </button>
      <div class="cameo-menu">
        <div class="cameo-opt" onclick="triggerCameo('deer')">🦌 成對梅花鹿（草地相依漫步）</div>
        <div class="cameo-opt" onclick="triggerCameo('redpandas_playing')">🦊 雙小熊貓（倒木嬉戲揮爪）</div>
        <div class="cameo-opt" onclick="triggerCameo('bear')">🐻 亞洲大黑熊（草地趴平納涼）</div>
        <div class="cameo-opt" onclick="triggerCameo('otter')">🦦 清溪小水獺（溪石小憩探頭）</div>
        <div class="cameo-opt" onclick="triggerCameo('beaver')">🦫 呆萌小河狸（溪畔細啃樹枝）</div>
        <div class="cameo-opt" onclick="triggerCameo('redpanda_curious')">🐼 好奇小熊貓（岩石探頭直視鏡頭）</div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 6px 0;">
        <div class="cameo-opt" onclick="toggleAutoCycle()" id="autoCycleOpt">⏸️ 暫停自動循環</div>
        <div class="cameo-opt" onclick="toggleIntervalMode()" id="intervalOpt">⚡ 切換為測試模式 (12秒)</div>
      </div>
    </div>

    <!-- 氛圍音效按鈕 -->
    <button class="tool-btn" id="audioBtn" onclick="toggleAudio()">
      <span>🎵</span> <span id="audioText">播放大自然與木吉他氛圍音</span>
    </button>

    <!-- 全螢幕按鈕 -->
    <button class="tool-btn" onclick="toggleFullscreen()">
      <span>⛶</span> <span>全螢幕展示</span>
    </button>
  </div>

  <script>
    // =========================================================
    // 1. 金色螢火蟲與晨光微塵粒子特效 Canvas
    // =========================================================
    const canvas = document.getElementById("particlesCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2.2 + 0.8;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.3 - 0.1;
        this.fadeSpeed = Math.random() * 0.008 + 0.004;
        this.fadingOut = Math.random() > 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.fadingOut) {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0.08) this.fadingOut = false;
        } else {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= 0.85) this.fadingOut = true;
        }
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        ctx.shadowColor = "rgba(255, 210, 90, 0.9)";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 48; i++) {
      particles.push(new Firefly());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // =========================================================
    // 2. Veo 3.1 1080p 真實野生動物動態彩蛋播放系統
    // =========================================================
    const cameos = {
      deer: {
        id: "deer",
        name: "成對梅花鹿",
        icon: "🦌",
        desc: "陽光草地：一公一母優雅梅花鹿緩步漫步相依...",
        src: "assets/videos/cameo_deer.mp4",
        duration: 8000
      },
      redpandas_playing: {
        id: "redpandas_playing",
        name: "雙小熊貓嬉戲",
        icon: "🦊",
        desc: "倒木青苔：兩隻小熊貓在原木旁揮舞小爪玩耍嬉戲...",
        src: "assets/videos/cameo_redpandas_playing.mp4",
        duration: 8000
      },
      bear: {
        id: "bear",
        name: "亞洲大黑熊",
        icon: "🐻",
        desc: "林間草坪：大黑熊慢步走入中央陽光草地大字型趴平納涼...",
        src: "assets/videos/cameo_bear.mp4",
        duration: 8000
      },
      otter: {
        id: "otter",
        name: "清溪水獺",
        icon: "🦦",
        desc: "左下淺溪：小水獺順水游來，爬上溪石探頭甩水...",
        src: "assets/videos/cameo_otter.mp4",
        duration: 8000
      },
      beaver: {
        id: "beaver",
        name: "可愛河狸",
        icon: "🦫",
        desc: "溪畔鵝卵石：小河狸爬上溪灘，低頭啃啃細樹枝...",
        src: "assets/videos/cameo_beaver.mp4",
        duration: 8000
      },
      redpanda_curious: {
        id: "redpanda_curious",
        name: "好奇小熊貓",
        icon: "🐼",
        desc: "左下岩石：小熊貓踏出樹後，好奇直視鏡頭嗅聞青苔...",
        src: "assets/videos/cameo_redpanda_curious.mp4",
        duration: 8000
      }
    };

    const cameoOrder = ["deer", "otter", "redpandas_playing", "bear", "beaver", "redpanda_curious"];
    let currentCameoIndex = 0;
    let isCameoActive = false;
    let autoCycleEnabled = true;
    let cycleIntervalMs = 45000; // 預設 45 秒悠閒偶遇一次
    let autoTimer = null;
    let toastTimer = null;

    const cameoVideo = document.getElementById("cameoVideo");

    function triggerCameo(cameoKey) {
      if (isCameoActive) return;
      const item = cameos[cameoKey];
      if (!item) return;

      isCameoActive = true;
      cameoVideo.src = item.src;
      cameoVideo.currentTime = 0;

      cameoVideo.play().then(() => {
        // 影片載入開始播放，平滑疊化淡入 (0.8s)
        cameoVideo.classList.add("active");
        showToast(item.icon, item.desc);
        playCameoChime(item.id);

        // 在第 7.2 秒時平滑疊化淡出，無縫回歸底層的 Loop 0 空景
        setTimeout(() => {
          cameoVideo.classList.remove("active");
        }, 7200);

        // 播畢後關閉影片並解除鎖定
        setTimeout(() => {
          cameoVideo.pause();
          isCameoActive = false;
        }, 8200);

      }).catch(err => {
        console.warn("Cameo video play hindered:", err);
        isCameoActive = false;
      });
    }

    function showToast(icon, text) {
      const toast = document.getElementById("cameoToast");
      const iconEl = toast.querySelector(".toast-icon");
      const textEl = document.getElementById("toastText");

      iconEl.innerText = icon;
      textEl.innerText = text;
      toast.classList.add("show");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 4500);
    }

    function autoScheduleNext() {
      if (!autoCycleEnabled) return;
      if (autoTimer) clearTimeout(autoTimer);

      autoTimer = setTimeout(() => {
        if (autoCycleEnabled && !isCameoActive) {
          const nextKey = cameoOrder[currentCameoIndex];
          currentCameoIndex = (currentCameoIndex + 1) % cameoOrder.length;
          triggerCameo(nextKey);
        }
        autoScheduleNext();
      }, cycleIntervalMs);
    }

    function toggleAutoCycle() {
      autoCycleEnabled = !autoCycleEnabled;
      const opt = document.getElementById("autoCycleOpt");
      if (autoCycleEnabled) {
        opt.innerText = "⏸️ 暫停自動循環";
        autoScheduleNext();
        showToast("🌿", "已啟動野生動物彩蛋自動循環");
      } else {
        opt.innerText = "▶️ 恢復自動循環";
        if (autoTimer) clearTimeout(autoTimer);
        showToast("🌿", "已暫停自動循環（可由選單手動點選播放）");
      }
    }

    function toggleIntervalMode() {
      const opt = document.getElementById("intervalOpt");
      if (cycleIntervalMs > 20000) {
        cycleIntervalMs = 12000; // 測試模式 12 秒
        opt.innerText = "🌸 切換為現場模式 (45秒)";
        showToast("⚡", "已切換為【測試模式】：每 12 秒彩蛋登場");
      } else {
        cycleIntervalMs = 45000; // 現場模式 45 秒
        opt.innerText = "⚡ 切換為測試模式 (12秒)";
        showToast("🌸", "已切換為【現場模式】：每 45 秒悠閒偶遇");
      }
      if (autoCycleEnabled) {
        autoScheduleNext();
      }
    }

    // 啟動首次彩蛋（網頁載入後 6 秒讓梅花鹿優雅出場）
    setTimeout(() => {
      if (autoCycleEnabled && !isCameoActive) {
        triggerCameo("deer");
        currentCameoIndex = 1;
      }
      autoScheduleNext();
    }, 6000);

    // =========================================================
    // 3. 全螢幕切換
    // =========================================================
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen request failed", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // =========================================================
    // 4. Web Audio 大自然微風 ＋ 空靈吉他微音合成器
    // =========================================================
    let audioCtx = null;
    let isAudioPlaying = false;
    let filterNode = null;
    let chimeTimer = null;

    function toggleAudio() {
      if (!isAudioPlaying) {
        startAudio();
        document.getElementById("audioText").innerText = "暫停氛圍音效";
        document.getElementById("audioBtn").style.background = "rgba(72, 98, 75, 0.95)";
        isAudioPlaying = true;
      } else {
        stopAudio();
        document.getElementById("audioText").innerText = "播放大自然與木吉他氛圍音";
        document.getElementById("audioBtn").style.background = "rgba(18, 30, 20, 0.90)";
        isAudioPlaying = false;
      }
    }

    function startAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // 微風白噪音合成
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = "bandpass";
      filterNode.frequency.setValueAtTime(450, audioCtx.currentTime);
      filterNode.Q.setValueAtTime(1.2, audioCtx.currentTime);

      const windGain = audioCtx.createGain();
      windGain.gain.setValueAtTime(0.035, audioCtx.currentTime);

      whiteNoise.connect(filterNode);
      filterNode.connect(windGain);
      windGain.connect(audioCtx.destination);
      whiteNoise.start();

      setInterval(() => {
        if (filterNode && audioCtx) {
          filterNode.frequency.setTargetAtTime(350 + Math.random() * 250, audioCtx.currentTime, 1.5);
        }
      }, 3000);

      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      function playChime() {
        if (!isAudioPlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        const freq = scale[Math.floor(Math.random() * scale.length)];
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.045, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 2.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 3.0);

        chimeTimer = setTimeout(playChime, 2500 + Math.random() * 3000);
      }
      playChime();
    }

    function playCameoChime(id) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        const baseFreq = id === "bear" ? 180 : (id === "otter" ? 520 : (id === "deer" ? 392 : 440));
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.2, audioCtx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.25);
      } catch (err) {}
    }

    function stopAudio() {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (chimeTimer) clearTimeout(chimeTimer);
    }
  </script>
</body>
</html>
