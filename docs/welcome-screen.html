<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry &amp; Winnie · 森林迎賓動態視覺 · 1080p 電影級零晃動雙緩衝播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d160f;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 16:9 全景森林大螢幕舞台 */
    .screen-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d160f;
    }

    /* 雙緩衝電影級 1080p 影片圖層 (A / B 雙軌無縫交替，徹底消除重影與背景晃動) */
    .cinema-video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* 會場愛迪生暖金穹頂色溫調校：增強對比與深翠綠意，壓抑過曝刺眼感 */
      filter: brightness(0.88) contrast(1.10) saturate(1.15);
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      transform: translateZ(0); /* GPU 硬體加速 */
    }

    .cinema-video-layer.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    /* 晨曦金光暖霧過場遮罩 (Sunbeam Bloom)
       切換時晨曦暖陽金光穿透林間（200ms 柔和升起，無感切換影片，220ms 自然淡出）
       100% 消除任何背景交疊、重影、位移晃動，彷彿走入神聖婚禮晨曦森林！ */
    .sunbeam-bloom-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 36%, 
        rgba(255, 238, 175, 0.95) 0%, 
        rgba(245, 205, 120, 0.72) 42%, 
        rgba(180, 135, 65, 0.38) 75%,
        rgba(15, 28, 18, 0.85) 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 0.20s ease-in-out;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .sunbeam-bloom-overlay.bloom-active {
      opacity: 1;
    }

    /* 電影深翠微暗過場遮罩 (Emerald Dip 模式) */
    .sunbeam-bloom-overlay.dip-mode {
      background: rgba(8, 16, 10, 0.98);
      mix-blend-mode: normal;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* 晨曦暖金與深翠漸層暗角（與阿沐 2700K 吊燈完美融合，純色靜態無晃動） */
    .light-mist-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 34%, rgba(240, 195, 110, 0.08) 0%, rgba(22, 38, 24, 0.24) 58%, rgba(8, 16, 10, 0.65) 100%);
      pointer-events: none;
      z-index: 4;
    }

    .canopy-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(10, 20, 12, 0.38) 0%, transparent 20%, transparent 80%, rgba(6, 14, 8, 0.55) 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* 動態晨曦丁達爾光柱微動呼吸（純透明度呼吸，不作 scale/transform，避免任何像素抖動） */
    .sunbeams-breathing {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 70%;
      height: 120%;
      background: radial-gradient(ellipse at 46% 32%, rgba(255, 230, 150, 0.15) 0%, rgba(240, 195, 100, 0.05) 45%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: godRaysPulse 12s ease-in-out infinite alternate;
      z-index: 5;
    }

    @keyframes godRaysPulse {
      0% { opacity: 0.50; }
      50% { opacity: 0.85; }
      100% { opacity: 0.55; }
    }

    /* 飄浮金色螢火蟲與光斑粒子 Canvas */
    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    /* 柔和微光彩蛋提示 Toast（幽雅低調，4秒後自動隱退） */
    .cameo-toast {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(16, 26, 18, 0.88);
      border: 1px solid rgba(230, 205, 140, 0.5);
      color: #f7eedc;
      padding: 10px 26px;
      border-radius: 30px;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cameo-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .cameo-toast .toast-icon {
      font-size: 1.25rem;
    }

    /* 底部操作控制列 (Hover 顯現，大螢幕播放時隱形低調) */
    .screen-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(16, 28, 18, 0.78);
      border: 1px solid rgba(220, 195, 130, 0.35);
      padding: 8px 20px;
      border-radius: 40px;
      z-index: 100;
      opacity: 0.15;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .screen-toolbar:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(230, 210, 150, 0.3);
      color: #f3efe6;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(230, 195, 110, 0.25);
      border-color: rgba(240, 215, 140, 0.8);
      color: #fff;
    }

    /* 下拉選單 */
    .cameo-dropdown {
      position: relative;
      display: inline-block;
    }

    .cameo-menu {
      display: none;
      position: absolute;
      bottom: 46px;
      right: 0;
      background: rgba(16, 28, 18, 0.96);
      border: 1px solid rgba(220, 195, 130, 0.45);
      border-radius: 14px;
      padding: 8px 0;
      min-width: 250px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .cameo-dropdown:hover .cameo-menu {
      display: block;
    }

    .cameo-opt {
      padding: 10px 18px;
      font-size: 0.82rem;
      color: #e6eee7;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .cameo-opt:hover {
      background: rgba(85, 118, 88, 0.65);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="screen-stage" id="screenStage">
    <!-- 雙緩衝電影級零卡頓播放器：A / B 圖層交替，徹底消除重影與背景晃動 -->
    <video class="cinema-video-layer active" id="playerA" playsinline muted preload="auto"></video>
    <video class="cinema-video-layer" id="playerB" playsinline muted preload="auto"></video>

    <!-- 晨曦金光暖霧過場層 (Sunbeam Bloom)
         切換影片時晨曦暖陽金光穿透林間，完全隱藏不同鏡位背景位移，無雙重視覺晃動 -->
    <div class="sunbeam-bloom-overlay" id="sunbeamBloom"></div>

    <!-- 晨曦暖金與暗角光影 -->
    <div class="light-mist-overlay"></div>
    <div class="canopy-vignette"></div>
    <div class="sunbeams-breathing"></div>
    <canvas id="particlesCanvas"></canvas>
  </div>

  <!-- 操作微光提示 Toast（僅供後台手動控制切換，動物漫步時 100% 零文字沉浸式視覺） -->
  <div class="cameo-toast" id="cameoToast">
    <span class="toast-icon">🌿</span>
    <span id="toastText"></span>
  </div>

  <!-- 浮動控制工具列 -->
  <div class="screen-toolbar">
    <!-- 召喚動物路過選單 -->
    <div class="cameo-dropdown">
      <button class="tool-btn">
        <span>🐾</span> <span>選擇森林動物 ▼</span>
      </button>
      <div class="cameo-menu">
        <div class="cameo-opt" onclick="manualPlay('deer')">🦌 成對梅花鹿（草地相依漫步）</div>
        <div class="cameo-opt" onclick="manualPlay('rabbit')">🐇 萌兔好奇（蹦跳鏡頭前抽鼻對視）</div>
        <div class="cameo-opt" onclick="manualPlay('otter')">🦦 清溪小水獺（溪石小憩探頭）</div>
        <div class="cameo-opt" onclick="manualPlay('sparrows')">🐦 靈動麻雀（飛降青苔石啄光斑歪頭）</div>
        <div class="cameo-opt" onclick="manualPlay('redpandas_playing')">🦊 雙小熊貓（倒木嬉戲揮爪）</div>
        <div class="cameo-opt" onclick="manualPlay('leopard_cat')">🐆 台灣石虎（優雅近步伏身凝視）</div>
        <div class="cameo-opt" onclick="manualPlay('bear')">🐻 亞洲大黑熊（草地趴平納涼）</div>
        <div class="cameo-opt" onclick="manualPlay('redpanda_curious')">🐼 好奇小熊貓（岩石嗅聞青苔）</div>
        <div class="cameo-opt" onclick="manualPlay('beaver')">🦫 呆萌小河狸（溪畔細啃樹枝）</div>
        <div class="cameo-opt" onclick="manualPlay('forest_empty')">🌿 晨曦空景（微風波光粼粼）</div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 6px 0;">
        <div class="cameo-opt" onclick="toggleAutoPlay()" id="autoPlayOpt">⏸️ 暫停自動巡遊</div>
        <div class="cameo-opt" onclick="toggleTransitionStyle()" id="transStyleOpt">✨ 過場效果：晨曦金光暖霧</div>
      </div>
    </div>

    <!-- 氛圍音效按鈕 -->
    <button class="tool-btn" id="audioBtn" onclick="toggleAudio()">
      <span>🎵</span> <span id="audioText">播放大自然與木吉他氛圍音</span>
    </button>

    <!-- 全螢幕按鈕 -->
    <button class="tool-btn" onclick="toggleFullscreen()">
      <span>⛶</span> <span>全螢幕展示</span>
    </button>
  </div>

  <script>
    // =========================================================
    // 1. 金色螢火蟲與晨光微塵粒子特效 Canvas
    // =========================================================
    const canvas = document.getElementById("particlesCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2.2 + 0.8;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.3 - 0.1;
        this.fadeSpeed = Math.random() * 0.008 + 0.004;
        this.fadingOut = Math.random() > 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.fadingOut) {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0.08) this.fadingOut = false;
        } else {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= 0.85) this.fadingOut = true;
        }
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        ctx.shadowColor = "rgba(255, 210, 90, 0.9)";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 48; i++) {
      particles.push(new Firefly());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // =========================================================
    // 2. 雙緩衝電影級零晃動野生動物漫步播放系統
    // =========================================================
    const playlist = [
      {
        id: "deer",
        name: "成對梅花鹿",
        icon: "🦌",
        desc: "陽光草地：一公一母優雅梅花鹿緩步漫步相依...",
        src: "assets/videos/cameo_deer.mp4",
        duration: 7800
      },
      {
        id: "rabbit",
        name: "萌兔好奇",
        icon: "🐇",
        desc: "前景草地：小萌兔一蹦一跳衝到鏡頭正前方，快速抽動粉鼻好奇對視...",
        src: "assets/videos/cameo_rabbit.mp4",
        duration: 7800
      },
      {
        id: "otter",
        name: "清溪水獺",
        icon: "🦦",
        desc: "左下淺溪：小水獺順水游來，爬上溪石探頭甩水...",
        src: "assets/videos/cameo_otter.mp4",
        duration: 7800
      },
      {
        id: "sparrows",
        name: "靈動麻雀",
        icon: "🐦",
        desc: "近景青苔石：三隻小麻雀輕盈飛降啄食金色光斑，歪頭盯著鏡頭眨眨眼...",
        src: "assets/videos/cameo_sparrows.mp4",
        duration: 7800
      },
      {
        id: "redpandas_playing",
        name: "雙小熊貓嬉戲",
        icon: "🦊",
        desc: "倒木青苔：兩隻小熊貓在原木旁揮舞小爪玩耍嬉戲...",
        src: "assets/videos/cameo_redpandas_playing.mp4",
        duration: 7800
      },
      {
        id: "leopard_cat",
        name: "台灣石虎",
        icon: "🐆",
        desc: "林邊灌木：優雅石虎邁著無聲貓步踏入近景，微伏身子好奇凝視...",
        src: "assets/videos/cameo_leopard_cat.mp4",
        duration: 7800
      },
      {
        id: "bear",
        name: "亞洲大黑熊",
        icon: "🐻",
        desc: "林間草坪：大黑熊慢步走入中央陽光草地大字型趴平納涼...",
        src: "assets/videos/cameo_bear.mp4",
        duration: 7800
      },
      {
        id: "redpanda_curious",
        name: "好奇小熊貓",
        icon: "🐼",
        desc: "左下岩石：小熊貓踏出樹後，好奇直視鏡頭嗅聞青苔...",
        src: "assets/videos/cameo_redpanda_curious.mp4",
        duration: 7800
      },
      {
        id: "beaver",
        name: "可愛河狸",
        icon: "🦫",
        desc: "溪畔鵝卵石：小河狸爬上溪灘，低頭啃啃細樹枝...",
        src: "assets/videos/cameo_beaver.mp4",
        duration: 7800
      },
      {
        id: "forest_empty",
        name: "晨曦空景",
        icon: "🌿",
        desc: "林間清溪：陽光微塵隨晨霧流轉，清澈水波細細粼粼...",
        src: "assets/videos/loop0_forest_empty.mp4",
        duration: 7600 // 於 7.6 秒平滑切換，完全避開 8 秒末尾回彈！
      }
    ];

    let currentIndex = 0;
    let isAutoPlay = true;
    let isTransitioning = false;
    let transitionTimer = null;
    let playTimer = null;
    let toastTimer = null;

    // 過場模式：'bloom' (晨曦金光暖霧) | 'clean' (電影直接切換) | 'dip' (深翠微暗)
    let transitionStyle = 'bloom';

    const playerA = document.getElementById("playerA");
    const playerB = document.getElementById("playerB");
    let activePlayer = playerA;
    let idlePlayer = playerB;

    const sunbeamBloom = document.getElementById("sunbeamBloom");

    function initPlayer() {
      const first = playlist[0];
      activePlayer.src = first.src;
      activePlayer.classList.add("active");
      activePlayer.play().catch(e => console.log("Init play hindered:", e));

      // 100% 純淨森林視窗：動物漫步不彈出文字 Toast，營造置身大自然的真實感
      preloadNext();
      scheduleNext(first.duration);
    }

    function preloadNext() {
      const nextIdx = (currentIndex + 1) % playlist.length;
      idlePlayer.src = playlist[nextIdx].src;
      idlePlayer.preload = "auto";
    }

    function transitionTo(targetIndex) {
      if (isTransitioning) return;
      isTransitioning = true;
      if (playTimer) clearTimeout(playTimer);

      const nextItem = playlist[targetIndex];
      idlePlayer.src = nextItem.src;
      idlePlayer.currentTime = 0;

      // 執行過場
      if (transitionStyle === 'bloom') {
        // 模式 1：晨曦金光暖霧 (最自然浪漫，零背景晃動)
        sunbeamBloom.classList.remove("dip-mode");
        sunbeamBloom.classList.add("bloom-active");

        setTimeout(() => {
          // 在金光頂峰 (200ms) 切換底層影片
          swapPlayers();
          playCameoChime(nextItem.id);

          setTimeout(() => {
            // 金光自然退去 (220ms)
            sunbeamBloom.classList.remove("bloom-active");
            isTransitioning = false;
            currentIndex = targetIndex;
            preloadNext();
            if (isAutoPlay) scheduleNext(nextItem.duration);
          }, 60);

        }, 200);

      } else if (transitionStyle === 'dip') {
        // 模式 2：電影深翠微暗場
        sunbeamBloom.classList.add("dip-mode");
        sunbeamBloom.classList.add("bloom-active");

        setTimeout(() => {
          swapPlayers();
          playCameoChime(nextItem.id);

          setTimeout(() => {
            sunbeamBloom.classList.remove("bloom-active");
            isTransitioning = false;
            currentIndex = targetIndex;
            preloadNext();
            if (isAutoPlay) scheduleNext(nextItem.duration);
          }, 60);

        }, 180);

      } else {
        // 模式 3：電影級直接切換 (Clean Cut, 俐落零延遲)
        swapPlayers();
        playCameoChime(nextItem.id);
        isTransitioning = false;
        currentIndex = targetIndex;
        preloadNext();
        if (isAutoPlay) scheduleNext(nextItem.duration);
      }
    }

    function swapPlayers() {
      idlePlayer.play().then(() => {
        idlePlayer.classList.add("active");
        activePlayer.classList.remove("active");
        activePlayer.pause();

        // 交換 active 與 idle 指針
        const temp = activePlayer;
        activePlayer = idlePlayer;
        idlePlayer = temp;
      }).catch(err => {
        console.warn("Player swap hindered:", err);
      });
    }

    function scheduleNext(durationMs) {
      if (!isAutoPlay) return;
      if (playTimer) clearTimeout(playTimer);

      playTimer = setTimeout(() => {
        if (isAutoPlay && !isTransitioning) {
          const nextIdx = (currentIndex + 1) % playlist.length;
          transitionTo(nextIdx);
        }
      }, durationMs);
    }

    function manualPlay(animalId) {
      const idx = playlist.findIndex(p => p.id === animalId);
      if (idx !== -1) {
        transitionTo(idx);
      }
    }

    function toggleAutoPlay() {
      isAutoPlay = !isAutoPlay;
      const opt = document.getElementById("autoPlayOpt");
      if (isAutoPlay) {
        opt.innerText = "⏸️ 暫停自動巡遊";
        const currentItem = playlist[currentIndex];
        scheduleNext(currentItem.duration);
        showToast("🌿", "已啟動森林動物自然巡遊漫步");
      } else {
        opt.innerText = "▶️ 恢復自動巡遊";
        if (playTimer) clearTimeout(playTimer);
        showToast("🌿", "已暫停巡遊（可由選單手動點選動物）");
      }
    }

    function toggleTransitionStyle() {
      const opt = document.getElementById("transStyleOpt");
      if (transitionStyle === 'bloom') {
        transitionStyle = 'clean';
        opt.innerText = "🎬 過場效果：電影級俐落切換";
        showToast("🎬", "已切換為【電影級俐落切換】(無延遲直接轉場)");
      } else if (transitionStyle === 'clean') {
        transitionStyle = 'dip';
        opt.innerText = "🌿 過場效果：森林深翠微暗";
        showToast("🌿", "已切換為【森林深翠微暗】(典雅微暗場)");
      } else {
        transitionStyle = 'bloom';
        opt.innerText = "✨ 過場效果：晨曦金光暖霧";
        showToast("✨", "已切換為【晨曦金光暖霧】(極致浪漫、零晃動)");
      }
    }

    function showToast(icon, text) {
      const toast = document.getElementById("cameoToast");
      const iconEl = toast.querySelector(".toast-icon");
      const textEl = document.getElementById("toastText");

      iconEl.innerText = icon;
      textEl.innerText = text;
      toast.classList.add("show");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 4200);
    }

    // =========================================================
    // 3. 全螢幕切換
    // =========================================================
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen request failed", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // =========================================================
    // 4. Web Audio 大自然微風 ＋ 空靈吉他微音合成器
    // =========================================================
    let audioCtx = null;
    let isAudioPlaying = false;
    let filterNode = null;
    let chimeTimer = null;

    function toggleAudio() {
      if (!isAudioPlaying) {
        startAudio();
        document.getElementById("audioText").innerText = "暫停氛圍音效";
        document.getElementById("audioBtn").style.background = "rgba(72, 98, 75, 0.95)";
        isAudioPlaying = true;
      } else {
        stopAudio();
        document.getElementById("audioText").innerText = "播放大自然與木吉他氛圍音";
        document.getElementById("audioBtn").style.background = "rgba(18, 30, 20, 0.90)";
        isAudioPlaying = false;
      }
    }

    function startAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // 微風白噪音合成
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = "bandpass";
      filterNode.frequency.setValueAtTime(450, audioCtx.currentTime);
      filterNode.Q.setValueAtTime(1.2, audioCtx.currentTime);

      const windGain = audioCtx.createGain();
      windGain.gain.setValueAtTime(0.035, audioCtx.currentTime);

      whiteNoise.connect(filterNode);
      filterNode.connect(windGain);
      windGain.connect(audioCtx.destination);
      whiteNoise.start();

      setInterval(() => {
        if (filterNode && audioCtx) {
          filterNode.frequency.setTargetAtTime(350 + Math.random() * 250, audioCtx.currentTime, 1.5);
        }
      }, 3000);

      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      function playChime() {
        if (!isAudioPlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const note = scale[Math.floor(Math.random() * scale.length)];

        osc.type = "sine";
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.028, audioCtx.currentTime + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 2.9);

        chimeTimer = setTimeout(playChime, 4000 + Math.random() * 5000);
      }
      playChime();
    }

    function stopAudio() {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (chimeTimer) clearTimeout(chimeTimer);
    }

    function playCameoChime(cameoId) {
      if (!isAudioPlaying || !audioCtx) return;
      const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 2.1);
        }, idx * 160);
      });
    }

    // 頁面加載完成後啟動雙緩衝播放器
    window.addEventListener("DOMContentLoaded", () => {
      initPlayer();
    });
  </script>
</body>
