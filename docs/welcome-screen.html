<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry &amp; Winnie · 森林迎賓動態視覺 · 1080p 電影級零晃動雙緩衝播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d160f;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 16:9 全景森林大螢幕舞台 */
    .screen-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d160f;
    }

    /* 雙緩衝電影級 1080p 影片圖層 (A / B 雙軌 2.0s 深度交叉淡入淡出，消除跳格與晃動) */
    .cinema-video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* 會場愛迪生暖金穹頂色溫調校：增強對比與深翠綠意，壓抑過曝刺眼感 */
      filter: brightness(0.90) contrast(1.08) saturate(1.15);
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.0);
      /* 電影級 2 秒超柔滑交叉溶解，徹底消除突然跳格 */
      transition: opacity 2.0s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .cinema-video-layer.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
      /* 頂級自然運鏡：18秒超平緩呼吸感攝影機微推微移，賦予大自然生生不息的活態感 */
      animation: cameraGliding 18s ease-in-out infinite alternate;
    }

    @keyframes cameraGliding {
      0% {
        transform: scale(1.0) translate(0%, 0%);
      }
      50% {
        transform: scale(1.026) translate(-0.5%, -0.3%);
      }
      100% {
        transform: scale(1.014) translate(0.4%, 0.25%);
      }
    }

    /* 晨曦金光暖霧過場遮罩 (Sunbeam Bloom)
       切換時晨曦暖陽金光柔柔漫射穿透林間（1.0s 緩緩升起，自然融合不同視角，1.0s 緩緩散開）
       完全消除任何背景突兀跳切，如真實微風撫過晨霧漫步林間！ */
    .sunbeam-bloom-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 36%, 
        rgba(255, 238, 175, 0.45) 0%, 
        rgba(245, 205, 120, 0.28) 45%, 
        rgba(180, 135, 65, 0.12) 75%,
        transparent 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 1.0s ease-in-out;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .sunbeam-bloom-overlay.bloom-active {
      opacity: 1;
    }

    /* 電影深翠微暗過場遮罩 (Emerald Dip 模式) */
    .sunbeam-bloom-overlay.dip-mode {
      background: rgba(8, 16, 10, 0.95);
      mix-blend-mode: normal;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* 晨曦暖金與深翠漸層暗角（與阿沐 2700K 吊燈完美融合，純色靜態無晃動） */
    .light-mist-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 34%, rgba(240, 195, 110, 0.08) 0%, rgba(22, 38, 24, 0.24) 58%, rgba(8, 16, 10, 0.65) 100%);
      pointer-events: none;
      z-index: 4;
    }

    .canopy-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(10, 20, 12, 0.38) 0%, transparent 20%, transparent 80%, rgba(6, 14, 8, 0.55) 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* 動態晨曦丁達爾光柱微動呼吸（純透明度呼吸，不作 scale/transform，避免任何像素抖動） */
    .sunbeams-breathing {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 70%;
      height: 120%;
      background: radial-gradient(ellipse at 46% 32%, rgba(255, 230, 150, 0.15) 0%, rgba(240, 195, 100, 0.05) 45%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: godRaysPulse 12s ease-in-out infinite alternate;
      z-index: 5;
    }

    @keyframes godRaysPulse {
      0% { opacity: 0.50; }
      50% { opacity: 0.85; }
      100% { opacity: 0.55; }
    }

    /* 飄浮金色螢火蟲與光斑粒子 Canvas */
    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    /* 柔和微光彩蛋提示 Toast（幽雅低調，4秒後自動隱退） */
    .cameo-toast {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(16, 26, 18, 0.88);
      border: 1px solid rgba(230, 205, 140, 0.5);
      color: #f7eedc;
      padding: 10px 26px;
      border-radius: 30px;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cameo-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .cameo-toast .toast-icon {
      font-size: 1.25rem;
    }

    /* 底部操作控制列 (Hover 顯現，大螢幕播放時隱形低調) */
    .screen-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(16, 28, 18, 0.78);
      border: 1px solid rgba(220, 195, 130, 0.35);
      padding: 8px 20px;
      border-radius: 40px;
      z-index: 100;
      opacity: 0.15;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .screen-toolbar:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(230, 210, 150, 0.3);
      color: #f3efe6;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;

      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(230, 195, 110, 0.25);
      border-color: rgba(240, 215, 140, 0.8);
      color: #fff;
    }

    /* 下拉選單 */
    .cameo-dropdown {
      position: relative;
      display: inline-block;
    }

    .cameo-menu {
      display: none;
      position: absolute;
      bottom: 46px;
      right: 0;
      background: rgba(16, 28, 18, 0.96);
      border: 1px solid rgba(220, 195, 130, 0.45);
      border-radius: 14px;
      padding: 8px 0;
      min-width: 250px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .cameo-dropdown:hover .cameo-menu {
      display: block;
    }

    .cameo-opt {
      padding: 10px 18px;
      font-size: 0.82rem;
      color: #e6eee7;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .cameo-opt:hover {
      background: rgba(85, 118, 88, 0.65);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="screen-stage" id="screenStage">
    <!-- 雙緩衝電影級零卡頓播放器：A / B 圖層交替，徹底消除重影與背景晃動 -->
    <video class="cinema-video-layer active" id="playerA" playsinline muted preload="auto"></video>
    <video class="cinema-video-layer" id="playerB" playsinline muted preload="auto"></video>

    <!-- 晨曦金光暖霧過場層 (Sunbeam Bloom)
         切換影片時晨曦暖陽金光穿透林間，完全隱藏不同鏡位背景位移，無雙重視覺晃動 -->

  <script>
    // =========================================================
    // 1. 金色螢火蟲與晨光微塵粒子特效 Canvas
    // =========================================================
    const canvas = document.getElementById("particlesCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2.2 + 0.8;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.3 - 0.1;
        this.fadeSpeed = Math.random() * 0.008 + 0.004;
        this.fadingOut = Math.random() > 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.fadingOut) {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0.08) this.fadingOut = false;
        } else {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= 0.85) this.fadingOut = true;
        }
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        ctx.shadowColor = "rgba(255, 210, 90, 0.9)";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 48; i++) {
      particles.push(new Firefly());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // =========================================================
    // 2. 雙緩衝電影級自然運鏡・野生動物客串播放系統
    // 晨曦林間清溪為主舞台，每隔一段時間動物自然出沒走入鏡頭，宛如真實森林
    // =========================================================
    const playlist = [
      {

      {

        src: "assets/videos/cameo_sparrows.mp4",
        duration: 8000
      },
      {
        id: "forest_empty",

      {

        src: "assets/videos/cameo_redpandas_playing.mp4",

      },
      {

        duration: 7200
      },
      {
        id: "bear",
        name: "大黑熊草地納涼",
        icon: "🐻",
        src: "assets/videos/cameo_bear.mp4",
        duration: 8000
      },
      {

        duration: 7200
      },
      {
        id: "beaver",
        name: "可愛河狸啃枝",
        icon: "🦫",
        src: "assets/videos/cameo_beaver.mp4",
        duration: 7800
      },
      {

        icon: "🌿",
        src: "assets/videos/loop0_forest_empty.mp4",
        duration: 7200
      },
      {
        id: "redpanda_curious",
        name: "小熊貓好奇嗅苔",
        icon: "🐼",
        src: "assets/videos/cameo_redpanda_curious.mp4",
        duration: 8000
      }
    ];

    let currentIndex = 0;
    let isAutoPlay = true;
    let isTransitioning = false;
    let watchdogTimer = null;
    let toastTimer = null;

    const playerA = document.getElementById("playerA");
    const playerB = document.getElementById("playerB");
    let activePlayer = playerA;
    let idlePlayer = playerB;
    const sunbeamBloom = document.getElementById("sunbeamBloom");

    function initPlayer() {
      // 綁定兩台播放器的事件監聽
      bindPlayerEvents(playerA);
      bindPlayerEvents(playerB);

      const first = playlist[0];
      activePlayer.src = first.src;
      activePlayer.classList.add("active");
      activePlayer.play().catch(e => console.log("Initial play deferred:", e));

      // 充裕預載下一部影片
      preloadUpcoming(1);

      // 啟動首段看門狗計時器
      armWatchdog(first.duration);
    }

    function bindPlayerEvents(player) {
      // 主動時間監聽：在影片結束前 2.0 秒啟動優雅無縫溶解過場
      player.ontimeupdate = () => {
        if (player !== activePlayer || !isAutoPlay || isTransitioning) return;
        if (player.duration && player.currentTime >= (player.duration - 2.0)) {
          triggerNext();
        }
      };

      player.onended = () => {
        if (player === activePlayer && isAutoPlay && !isTransitioning) {
          triggerNext();
        }
      };

      player.onerror = (err) => {
        console.warn("Video layer encountered issue, safely advancing:", err);
        if (player === activePlayer && !isTransitioning) {
          triggerNext();
        }
      };
    }

    function triggerNext() {
      if (isTransitioning) return;
      const nextIdx = (currentIndex + 1) % playlist.length;
      performTransition(nextIdx);
    }

    function armWatchdog(durationMs) {
      clearTimeout(watchdogTimer);
      // 安全看門狗：若網路緩衝或未觸發 timeupdate，最遲於 duration + 1.2 秒強制推進，確保永不卡死
      watchdogTimer = setTimeout(() => {
        if (isAutoPlay && !isTransitioning) {
          console.log("Watchdog safely advancing scene");
          triggerNext();
        }
      }, (durationMs || 8000) + 1200);
    }

    async function performTransition(targetIndex) {
      if (isTransitioning) return;
      isTransitioning = true;
      clearTimeout(watchdogTimer);

      const nextItem = playlist[targetIndex];
      const targetUrl = new URL(nextItem.src, window.location.href).href;

      if (idlePlayer.src !== targetUrl) {
        idlePlayer.src = nextItem.src;
        idlePlayer.load();
      }
      idlePlayer.currentTime = 0;

      // 觸發動物專屬腳步與環境特徵音效
      playAnimalSound(nextItem.id);

      // 1. 確保新影片在底層已經解碼開跑 (此時 idlePlayer 仍在 opacity: 0，完全看不見)
      try {
        await idlePlayer.play();
      } catch (err) {
        console.warn("Play() deferred, retrying muted:", err);
        idlePlayer.muted = true;
        try { await idlePlayer.play(); } catch(e) {}
      }

      // 2. 升起晨曦金色暖霧 (1.0s 柔和升起，融合畫面避免生硬跳格)
      sunbeamBloom.classList.add("bloom-active");

      // 3. 雙圖層無縫 2.0 秒交叉溶解 (Cross-Dissolve)
      idlePlayer.classList.add("active");
      activePlayer.classList.remove("active");

      // 4. 1.0s 後，金光暖霧自然散去
      setTimeout(() => {
        sunbeamBloom.classList.remove("bloom-active");
      }, 1000);

      // 5. 2.0s 後，交叉過場完全結束
      setTimeout(() => {
        activePlayer.pause();
        activePlayer.currentTime = 0;

        // 交換 active 與 idle 指針
        const temp = activePlayer;
        activePlayer = idlePlayer;
        idlePlayer = temp;

        currentIndex = targetIndex;
        isTransitioning = false;

        // 為下一部影片充裕預載 (保證有整整 6~8 秒的下載緩衝時間)
        const upcomingIdx = (currentIndex + 1) % playlist.length;
        preloadUpcoming(upcomingIdx);

        // 重設定時保護看門狗
        if (isAutoPlay) {
          armWatchdog(nextItem.duration);
        }
      }, 2000);
    }

    function preloadUpcoming(index) {
      const upcomingItem = playlist[index];
      const targetUrl = new URL(upcomingItem.src, window.location.href).href;
      if (idlePlayer.src !== targetUrl) {
        idlePlayer.src = upcomingItem.src;
        idlePlayer.preload = "auto";
        idlePlayer.load();
      }
    }

    function manualPlay(animalId) {
      const idx = playlist.findIndex(p => p.id === animalId);
      if (idx !== -1) {
        performTransition(idx);
      }
    }

    function toggleAutoPlay() {
      isAutoPlay = !isAutoPlay;
      const opt = document.getElementById("autoPlayOpt");
      if (isAutoPlay) {
        opt.innerText = "⏸️ 暫停自動巡遊";
        triggerNext();
        showToast("🌿", "已啟動森林動物自然巡遊漫步");
      } else {
        opt.innerText = "▶️ 恢復自動巡遊";
        clearTimeout(watchdogTimer);
        showToast("🌿", "已暫停巡遊（可由選單手動點選動物）");
      }
    }

    function toggleTransitionStyle() {
      showToast("✨", "當前已套用【晨曦金光暖霧 ＋ 2.0s 自然運鏡】");
    }

    // =========================================================
    // 3. 森林深處多音軌生態音效引擎 (Forest Eco-Audio Engine)
    // 包含：清溪流淌潺潺水聲、深林微風、偶爾鳥鳴、溪石蛙鳴、動物出沒專屬腳步特徵音
    // =========================================================
    let isAudioPlaying = false;
    let streamAudio = null;
    let birdAudio = null;
    let frogAudio = null;
    let birdTimer = null;
    let frogTimer = null;
    const animalAudioMap = {};

    function initAudioEngine() {
      if (streamAudio) return;

      // 1. 溪流流水與深林微風背景聲 (循環播放)
      streamAudio = new Audio("assets/audio/forest_stream_deep.mp3");
      streamAudio.loop = true;
      streamAudio.volume = 0.65;

      // 2. 偶爾清脆鳥鳴
      birdAudio = new Audio("assets/audio/birds_woodland.mp3");
      birdAudio.volume = 0.50;

      // 3. 偶爾溪畔蛙鳴
      frogAudio = new Audio("assets/audio/frogs_stream.mp3");
      frogAudio.volume = 0.45;

      // 4. 動物出場腳步與特徵音
      const animalSounds = {
        deer: "assets/audio/steps_deer.mp3",
        rabbit: "assets/audio/steps_rabbit.mp3",
        otter: "assets/audio/steps_otter.mp3",
        sparrows: "assets/audio/steps_sparrows.mp3",
        redpandas_playing: "assets/audio/steps_redpandas.mp3",
        leopard_cat: "assets/audio/steps_leopard_cat.mp3",
        bear: "assets/audio/steps_bear.mp3",
        redpanda_curious: "assets/audio/steps_redpandas.mp3",
        beaver: "assets/audio/steps_beaver.mp3"
      };

      for (const [id, src] of Object.entries(animalSounds)) {
        const aud = new Audio(src);
        aud.preload = "auto";
        aud.volume = 0.75;
        animalAudioMap[id] = aud;
      }
    }

    function startForestAudio() {
      initAudioEngine();
      isAudioPlaying = true;

      // 播放清溪水流與微風
      streamAudio.play().catch(e => console.log("Stream play deferred until gesture:", e));

      // 隨機間隔觸發鳥鳴 (每 7 ~ 15 秒鳴唱一次)
      scheduleNextBird();

      // 隨機間隔觸發溪畔蛙鳴 (每 9 ~ 20 秒鳴叫一次)
      scheduleNextFrog();

      updateAudioButtonUI(true);
      showToast("🌿", "已開啟森林深處清溪流水、鳥叫蛙鳴與動物步履");
    }

    function stopForestAudio() {
      isAudioPlaying = false;
      if (streamAudio) streamAudio.pause();
      if (birdAudio) birdAudio.pause();
      if (frogAudio) frogAudio.pause();
      clearTimeout(birdTimer);
      clearTimeout(frogTimer);
      updateAudioButtonUI(false);
      showToast("🌿", "已暫停森林環境音效");
    }

    function scheduleNextBird() {
      clearTimeout(birdTimer);
      if (!isAudioPlaying) return;
      const delay = 6000 + Math.random() * 8000;
      birdTimer = setTimeout(() => {
        if (isAudioPlaying && birdAudio) {
          birdAudio.currentTime = 0;
          birdAudio.play().catch(() => {});
          scheduleNextBird();
        }
      }, delay);
    }

    function scheduleNextFrog() {
      clearTimeout(frogTimer);
      if (!isAudioPlaying) return;
      const delay = 8000 + Math.random() * 11000;
      frogTimer = setTimeout(() => {
        if (isAudioPlaying && frogAudio) {
          frogAudio.currentTime = 0;
          frogAudio.play().catch(() => {});
          scheduleNextFrog();
        }
      }, delay);
    }

    function playAnimalSound(animalId) {
      if (!isAudioPlaying) return;
      const sound = animalAudioMap[animalId];
      if (sound) {
        // 在新動物畫面淡入浮現 (400ms) 時踏出真實腳步聲
        setTimeout(() => {
          if (!isAudioPlaying) return;
          sound.currentTime = 0;
          sound.play().catch(e => console.log("Animal step audio deferred:", e));
        }, 400);
      }
    }

    function toggleAudio() {
      if (!isAudioPlaying) {
        startForestAudio();
      } else {
        stopForestAudio();
      }
    }

    function updateAudioButtonUI(playing) {
      const btnText = document.getElementById("audioText");
      const btn = document.getElementById("audioBtn");
      if (playing) {
        btnText.innerText = "🔊 森林溪流・鳥語蛙鳴・動物步履（播放中）";
        btn.style.background = "rgba(45, 92, 55, 0.92)";
        btn.style.borderColor = "rgba(240, 220, 150, 0.9)";
      } else {
        btnText.innerText = "🎵 開啟森林深處生態音（清溪流水・鳥語蛙鳴・動物步履）";
        btn.style.background = "rgba(255, 255, 255, 0.08)";
        btn.style.borderColor = "rgba(230, 210, 150, 0.3)";
      }
    }

    // 支援首次任意點擊頁面時預載 Audio 物件
    window.addEventListener("click", () => {
      initAudioEngine();
    }, { once: true });

    // =========================================================
    // 4. 操作微光提示 Toast
    // =========================================================
    function showToast(icon, text) {
      const toast = document.getElementById("cameoToast");
      const iconEl = toast.querySelector(".toast-icon");
      const textEl = document.getElementById("toastText");

      iconEl.innerText = icon;
      textEl.innerText = text;
      toast.classList.add("show");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    // =========================================================
    // 5. 全螢幕切換
    // =========================================================
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen request failed", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 頁面加載完成後啟動雙緩衝播放器
    window.addEventListener("DOMContentLoaded", () => {
      initPlayer();
    });
  </script>
</body>
</html>
